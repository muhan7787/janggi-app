<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장기판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@900&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=Liu+Jian+Mao+Cao&family=Long+Cang&family=Noto+Sans+TC:wght@900&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: 조용한 대국실, 화면 그대로의 장기판
IDEA: 영상 속 나무 장기판과 팔각 장기알
PICTURE: 판 자체가 화면의 주인공, 위쪽에 작게 제목
COLOUR and TYPE: 어두운 바탕, 밝은 나무색 판, 초 파랑·한 빨강 / Noto Serif TC 굵은 한자
LAYOUT: 한 열, 판 아래 조작 버튼
*/
:root{color-scheme:light dark;--bg:light-dark(#2a2a2c,#1b1b1d);--ink:#f2efe8;--sub:#b9b4aa;--btn:#3a3a3e;--btnh:#4a4a50}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
main{max-width:620px;margin:0 auto;padding:20px 12px 36px}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
p.note{margin:0 0 14px;color:var(--sub);font-size:14px}
.board{width:100%;aspect-ratio:920/1020;display:block;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45);touch-action:manipulation;user-select:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;font-size:15px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #55555b;background:var(--btn);color:var(--ink);cursor:pointer}
button:hover{background:var(--btnh)}
button:focus-visible{outline:3px solid #f0b84a;outline-offset:2px}
.fonts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px}
.fonts span{color:var(--sub);font-size:14px;margin-right:4px}
.fonts button{min-height:40px;padding:0 12px;font-size:14px}
.fonts button[aria-pressed=true]{background:#1c4fbf;border-color:#6d93e8}
.play{display:flex;flex-direction:column;gap:8px}
.play.flip .pl-cho{order:3}.play.flip .board{order:2}.play.flip .pl-han{order:1}
.pl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#333338;border:2px solid transparent;border-radius:12px;padding:8px 10px}
.pl.on{border-color:#f0b84a;background:#3d3a33}
.chip{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;font:900 17px "Noto Serif TC",serif;background:#f4f5f7}
.pl-cho .chip{color:#1a3fae}.pl-han .chip{color:#cf1f17}
.pl input:disabled,.pl select:disabled{opacity:.8}
.pl input{flex:1 1 90px;min-width:70px;font:inherit;font-size:16px;min-height:40px;padding:0 10px;border-radius:8px;border:1px solid #55555b;background:#26262a;color:var(--ink)}
.pl select,.bar select{font:inherit;font-size:16px;min-height:40px;padding:0 8px;border-radius:8px;border:1px solid #55555b;background:#26262a;color:var(--ink)}
.score{font-size:15px;color:var(--sub);white-space:nowrap}.score b{color:var(--ink);font-size:17px}
.rs{min-height:38px;padding:0 12px;font-size:14px;background:#5a2a2a;border-color:#8a4040}.rs.ask{background:#c0392b;border-color:#e57366}.rs[hidden]{display:none}
.clock{font:700 22px/1 "Noto Sans KR",system-ui;font-variant-numeric:tabular-nums;min-width:76px;text-align:right;white-space:nowrap}
.pl.out .score{font-size:15px;color:var(--sub);white-space:nowrap}.score b{color:var(--ink);font-size:17px}
.rs{min-height:38px;padding:0 12px;font-size:14px;background:#5a2a2a;border-color:#8a4040}.rs.ask{background:#c0392b;border-color:#e57366}.rs[hidden]{display:none}
.clock{color:#ff6b5e}
.fl{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:14px}
button.warn{background:#5a2a2a;border-color:#8a4040}button.warn:hover{background:#6e3232}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.top h1{margin:0}.me{flex:1 1 200px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;color:var(--sub)}
.me b{color:var(--ink);font-size:16px}.me .rk{background:#f0b84a;color:#2a2a2c;font-weight:700;border-radius:6px;padding:1px 8px}
.me .prog{white-space:nowrap}.pbar{flex:1 1 100%;height:6px;background:#44444a;border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:#f0b84a}
button.sm{min-height:38px;font-size:14px;padding:0 12px}
body.locked main{filter:blur(3px);pointer-events:none}
.gate{position:fixed;inset:0;background:rgba(20,20,22,.82);display:grid;place-items:center;padding:16px;z-index:10}
.gate[hidden]{display:none}
.card{width:min(360px,100%);background:#2f2f33;border:1px solid #4a4a50;border-radius:18px;padding:24px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.logo{align-self:center;width:84px;height:84px;background:#e6bd72;border-radius:20px;display:grid;place-items:center}
.logo span{width:62px;height:62px;display:grid;place-items:center;background:#f4f5f7;clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);font:900 34px "Noto Serif TC",serif;color:#cf1f17}
.card h2{margin:0;text-align:center;font-size:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tabs button[aria-selected=true]{background:#f0b84a;color:#2a2a2c;border-color:#f0b84a;font-weight:700}
.card label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--sub)}.card label[hidden]{display:none}
.card input{font:inherit;font-size:16px;min-height:46px;padding:0 12px;border-radius:10px;border:1px solid #55555b;background:#232326;color:var(--ink)}
.card input:focus-visible{outline:3px solid #f0b84a;outline-offset:1px}
.amsg{margin:0;min-height:20px;color:#ff8a7e;font-size:14px}.go{background:#cf1f17;border-color:#cf1f17;font-weight:700;min-height:48px}
.fine{margin:0;text-align:center;color:var(--sub);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;background:#f0b84a;color:#2a2a2c;font-weight:700;padding:12px 18px;border-radius:12px;pointer-events:none;z-index:20;transition:.3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#turn{margin-left:auto;align-self:center;color:var(--sub);font-size:14px}
.pc{cursor:pointer}
.pc text{pointer-events:none}
@media (prefers-reduced-motion:no-preference){.pc{transition:transform .18s ease}}
</style>
</head>
<body>
<main>
<div class="top"><h1>장기</h1><div class="me" id="me-info"></div><button id="logout" class="sm">로그아웃</button></div>
<p class="note">AI를 이기면 승수가 쌓이고, 급수는 3승·단은 5승마다 승급합니다. AI도 내 급수에 맞춰 강해져요. 새 게임으로 시작한 AI 대국만 기록됩니다.</p>
<div class="play" id="play"><div class="pl pl-cho" id="pl-cho"><span class="chip">楚</span><input id="nm-cho" value="초" aria-label="초 이름" maxlength="14"><select id="rk-cho" aria-label="초 급수"><option>18급</option><option>17급</option><option>16급</option><option>15급</option><option>14급</option><option>13급</option><option>12급</option><option>11급</option><option>10급</option><option>9급</option><option>8급</option><option>7급</option><option>6급</option><option>5급</option><option>4급</option><option>3급</option><option>2급</option><option>1급</option><option>1단</option><option>2단</option><option>3단</option><option>4단</option><option>5단</option><option>6단</option><option>7단</option><option>8단</option><option>9단</option></select><span class="score" id="sc-cho"></span><button class="rs" id="rs-cho" data-side="cho">기권</button><span class="clock" id="ck-cho">05:00</span></div><svg class="board" id="b" viewBox="0 0 920 1020" xmlns="http://www.w3.org/2000/svg"></svg><div class="pl pl-han" id="pl-han"><span class="chip">漢</span><input id="nm-han" value="한" aria-label="한 이름" maxlength="14"><select id="rk-han" aria-label="한 급수"><option>18급</option><option>17급</option><option>16급</option><option>15급</option><option>14급</option><option>13급</option><option>12급</option><option>11급</option><option>10급</option><option>9급</option><option>8급</option><option>7급</option><option>6급</option><option>5급</option><option>4급</option><option>3급</option><option>2급</option><option>1급</option><option>1단</option><option>2단</option><option>3단</option><option>4단</option><option>5단</option><option>6단</option><option>7단</option><option>8단</option><option>9단</option></select><span class="score" id="sc-han"></span><button class="rs" id="rs-han" data-side="han">기권</button><span class="clock" id="ck-han">05:00</span></div></div>
<div class="bar">
  <select id="mode" aria-label="대국 방식"><option value="ai" selected>AI와 두기</option><option value="two">둘이 두기</option><option value="free">자유 이동</option></select>
  <select id="aiside" aria-label="AI 진영"><option value="cho" selected>AI가 초</option><option value="han">AI가 한</option></select>
  <button id="undo">한 수 무르기</button>
  <button id="reset">영상 배치로</button>
  <label class="fl">초 포진 <select id="f-cho" aria-label="초 포진"><option selected>마상상마</option><option>상마마상</option><option>마상마상</option><option>상마상마</option></select></label>
  <label class="fl">한 포진 <select id="f-han" aria-label="한 포진"><option>마상상마</option><option>상마마상</option><option>마상마상</option><option>상마상마</option></select></label>
  <button id="start">새 게임</button>
  <button id="resign" class="warn">기권</button>
  <button id="flip">판 뒤집기</button>
  <button id="clockbtn">시계 시작</button>
  <select id="tsel" aria-label="제한 시간"><option value="180">3분</option><option value="300" selected>5분</option><option value="600">10분</option><option value="1200">20분</option></select>
  <span id="turn"></span>
</div>
</main>
<div id="toast" role="status"></div>
<div class="gate" id="gate" hidden>
 <form class="card" id="authf" novalidate>
  <div class="logo"><span>將</span></div>
  <h2>장기</h2>
  <div class="tabs" role="tablist"><button type="button" role="tab" data-tab="login">로그인</button><button type="button" role="tab" data-tab="join">회원가입</button></div>
  <label>아이디<input id="aid" autocomplete="username" maxlength="12" required></label>
  <label>비밀번호<input id="apw" type="password" autocomplete="current-password" required></label>
  <label id="pw2w" hidden>비밀번호 확인<input id="apw2" type="password" autocomplete="new-password"></label>
  <p class="amsg" id="amsg" role="alert"></p>
  <button type="submit" id="asub" class="go">로그인</button>
  <p class="fine">계정과 기록은 이 기기에만 저장됩니다.</p>
 </form>
</div>

 targets.forEach(q=>{const c=q%9,r=(q/9)|0,occ=pieces.some(p=>p.c===c&&p.r===r);
  svg.appendChild(occ?el('circle',{cx:X(vc(c)),cy:Y(vr(r)),r:52,fill:'none',stroke:'#2fae5a','stroke-width':7,'pointer-events':'none'})
   :el('circle',{cx:X(vc(c)),cy:Y(vr(r)),r:15,fill:'#2fae5a','fill-opacity':.85,'pointer-events':'none'}));});
 document.getElementById('turn').textContent=thinking?'AI 생각 중…':over?status:sel!==null?'옮길 자리를 고르세요':`${status?status+' · ':''}${hist.length}수 · ${NM(turn)} 차례`;
}
function tapPiece(p){
 if(mode!=='free'){
  if(over||thinking)return;
  if(sel!==null&&p.s!==turn){const q=p.r*9+p.c;if(targets.includes(q)){const s=pieces.find(x=>x.id===sel);return move(s,p.c,p.r);}return;}
  if(p.s!==turn||(mode==='ai'&&p.s===aiSide))return;
  if(sel===p.id){sel=null;targets=[];draw();return;}
  sel=p.id;targets=legalFor(p);draw();return;
 }
 if(sel===null){sel=p.id;draw();return;}
 const s=pieces.find(q=>q.id===sel);
 if(s.id===p.id){sel=null;draw();return;}
 if(s.s===p.s){sel=p.id;draw();return;}
 move(s,p.c,p.r);
}
function tap(c,r){
 if(sel===null)return;
 const s=pieces.find(q=>q.id===sel);
 const there=pieces.find(q=>q.c===c&&q.r===r);
 if(there)return tapPiece(there);
 if(mode!=='free'){if(targets.includes(r*9+c))move(s,c,r);else{sel=null;targets=[];draw();}return;}
 move(s,c,r);
}
function move(s,c,r){
 hist.push(JSON.stringify({pieces,last,turn}));
 pieces=pieces.filter(q=>!(q.c===c&&q.r===r&&q.id!==s.id));
 last=[s.c,s.r];s.c=c;s.r=r;sel=null;targets=[];turn=s.s==='cho'?'han':'cho';if(run)lastT=performance.now();checkState();paintPl();draw();maybeAI();
}
document.getElementById('undo').addEventListener('click',()=>{if(thinking||!hist.length)return;
 const pop=()=>{const h=JSON.parse(hist.pop());pieces=h.pieces;last=h.last;if(h.turn)turn=h.turn;};
 pop();if(mode==='ai')while(turn===aiSide&&hist.length)pop();
 sel=null;targets=[];checkState();paintPl();draw();maybeAI();});
document.getElementById('reset').addEventListener('click',()=>load(VIDEO));
const newGame=()=>load(makeStart(document.getElementById('f-cho').value,document.getElementById('f-han').value),true);
document.getElementById('start').addEventListener('click',newGame);
['f-cho','f-han'].forEach(id=>document.getElementById(id).addEventListener('change',()=>{if(!hist.length&&!thinking)newGame();}));
function resign(loser){if(over||mode==='free')return;over=loser==='cho'?'han':'cho';
 status=`${NM(loser)} 기권 · ${NM(over)} 승리`;sel=null;targets=[];setRun(false);finishGame();
 if(thinking&&worker){worker.terminate();worker=null;try{const src=janggiEngine.toString()+';const E=janggiEngine();onmessage=e=>postMessage(E.search(e.data.b,e.data.s,e.data.ms,e.data.maxD,e.data.noise));';worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));}catch(e){}}
 thinking=false;paintPl();draw();}
let askT=null;
function askResign(btn,loser){if(over||mode==='free')return;
 if(btn.classList.contains('ask')){clearTimeout(askT);btn.classList.remove('ask');btn.textContent=btn.dataset.l;resign(loser);return;}
 btn.dataset.l=btn.dataset.l||btn.textContent;btn.classList.add('ask');btn.textContent='정말 기권?';
 askT=setTimeout(()=>{btn.classList.remove('ask');btn.textContent=btn.dataset.l;},3000);}
document.getElementById('resign').addEventListener('click',e=>askResign(e.currentTarget,mode==='ai'?(aiSide==='cho'?'han':'cho'):turn));
for(const k of ['cho','han'])document.getElementById('rs-'+k).addEventListener('click',e=>askResign(e.currentTarget,k));
document.getElementById('flip').addEventListener('click',()=>{flip=!flip;paintPl();draw();});
document.getElementById('mode').addEventListener('change',e=>{if(thinking)return;mode=e.target.value;applyMode();});
document.getElementById('aiside').addEventListener('change',e=>{if(thinking)return;aiSide=e.target.value;applyMode();if(mode==='ai')newGame();});
pieces=makeStart('마상상마','마상상마').map(([s,t,c,r],i)=>({id:i,s,t,c,r}));draw();
initAuth();
}
</script>
